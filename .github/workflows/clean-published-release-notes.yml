name: Clean published release descriptions
on:
  push:
    paths:
      - .github/workflows/clean-published-release-notes.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove outdated on-device testing caveats from release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in v0.2.4 v0.2.5; do
            gh release view "$tag" --json body --jq '.body' > "$RUNNER_TEMP/notes.md"
            export RELEASE_TAG="$tag"
            python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "notes.md"
          original = path.read_text()
          replacements = {
              "Взаимодействие с реальным экраном и перетаскивание необходимо проверить на телефоне.": "",
              "On-device UI behavior and dragging still require user testing.": "",
              "Поведение перетаскивания и локализации на реальном телефоне необходимо проверить после установки.": "",
              "on-device drag and translation behavior still require verification.": "",
          }
          text = original
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit(f"No matching text in {os.environ['RELEASE_TAG']}: refusing unexpected update")
          text = text.replace("  ", " ")
          path.write_text(text)
          PY
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Cleaned $tag"
          done
